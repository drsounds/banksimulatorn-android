name: Android Play Store Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track to publish to"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      releaseNotes:
        description: "Optional release notes for this build (shown on the Play Store track)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build signed AAB and upload to Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Clean up keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore"

      - name: Upload AAB build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Prepare release notes
        if: ${{ github.event.inputs.releaseNotes != '' }}
        run: |
          mkdir -p "${{ runner.temp }}/whatsnew"
          printf '%s' "${{ github.event.inputs.releaseNotes }}" > "${{ runner.temp }}/whatsnew/whatsnew-en-US"

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: se.banksimulatorn.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed
          whatsNewDirectory: ${{ github.event.inputs.releaseNotes != '' && format('{0}/whatsnew', runner.temp) || '' }}
